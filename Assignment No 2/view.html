<!DOCTYPE html>
<html>
<head>
    <title>Student Information</title>

</head>
<body>

<h2>Student Information Table</h2>

<br><br>

        <th>Math</th>
        <th>English</th>
        <th>Total</th>

<script src="script.js"></script>

</body>
</html>
